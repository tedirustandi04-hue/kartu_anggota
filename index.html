<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Anggota - SSB Putra Asgar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print { .no-print { display: none !important; } }
        .card-container { width: 340px; height: 215px; position: relative; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 2px solid #166534; background: #166534; color: white; }
        .bg-football { background: linear-gradient(135deg, #166534 0%, #15803d 100%); }
        .watermark { position: absolute; top: 20%; left: 20%; width: 60%; height: 60%; opacity: 0.15; z-index: 0; pointer-events: none; }
        .content { position: relative; z-index: 1; padding: 12px; height: 100%; display: flex; flex-direction: column; }
        .back-card { background: white; color: #1e293b; border: 2px solid #e2e8f0; }
        .photo-box { width: 64px; height: 80px; background: #eee; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    </style>
</head>
<body class="bg-slate-100 p-8">

    <div class="max-w-4xl mx-auto mb-8 no-print bg-white p-6 rounded-xl shadow-lg border-l-8 border-green-700">
        <h2 class="text-xl font-bold text-slate-800 mb-2">Import Data Pemain</h2>
        <p class="text-sm text-slate-600 mb-4">Pastikan header CSV: <b>Nama, NISN, KU, TTL, Sekolah, Alamat, Foto, Posisi</b>.</p>
        
        <input type="file" id="csvFile" accept=".csv" class="block w-full mb-4 file:bg-green-600 file:text-white file:py-2 file:px-4 file:rounded-full">
        
        <div id="filterSection" class="hidden mb-6 flex items-center gap-4">
            <label class="font-bold text-slate-700">Pilih KU:</label>
            <select id="kuFilter" onchange="renderCards()" class="p-2 border rounded-full px-4">
                <option value="Semua">Semua Kelompok Usia</option>
            </select>
        </div>

        <div id="debug" class="text-xs text-red-600 font-mono mb-2 italic"></div>
        <button onclick="window.print()" class="bg-slate-800 text-white py-2 px-6 rounded-full hover:bg-slate-900 shadow-md">Cetak Kartu yang Ditampilkan</button>
    </div>

    <div id="card-grid" class="flex flex-wrap gap-8 justify-center"></div>

    <script>
        let allPlayers = [];

        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) { processData(e.target.result); };
            reader.readAsText(file);
        });

        function processData(text) {
            const lines = text.split(/\r?\n/);
            if (lines.length < 2) return;

            const rawHeaders = lines[0].split(/[;,]/).map(h => h.trim().toLowerCase());
            document.getElementById('debug').innerText = "Headers terdeteksi: " + rawHeaders.join(", ");

            const getCol = (keys) => {
                for (let key of keys) {
                    const idx = rawHeaders.findIndex(h => h.includes(key.toLowerCase()));
                    if (idx !== -1) return idx;
                }
                return -1;
            };

            const idx = {
                nama: getCol(['nama', 'lengkap', 'pemain']),
                nisn: getCol(['nisn']),
                ku: getCol(['ku', 'kelompok']),
                ttl: getCol(['ttl', 'lahir']),
                sekolah: getCol(['sekolah']),
                alamat: getCol(['alamat']),
                foto: getCol(['foto', 'photo', 'image']),
                posisi: getCol(['posisi', 'peran', 'role'])
            };

            allPlayers = [];
            const uniqueKU = new Set();

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const vals = lines[i].split(/[;,]/).map(v => v.trim());
                if (vals.length < 2) continue;

                const playerData = {
                    nama: vals[idx.nama] || '-',
                    nisn: vals[idx.nisn] || '-',
                    ku: vals[idx.ku] || 'Tanpa KU',
                    ttl: vals[idx.ttl] || '-',
                    sekolah: vals[idx.sekolah] || '-',
                    alamat: vals[idx.alamat] || '-',
                    foto: vals[idx.foto] || '',
                    posisi: vals[idx.posisi] || '-'
                };
                allPlayers.push(playerData);
                uniqueKU.add(playerData.ku);
            }

            // Update UI
            document.getElementById('filterSection').classList.remove('hidden');
            const select = document.getElementById('kuFilter');
            select.innerHTML = '<option value="Semua">Semua Kelompok Usia</option>';
            uniqueKU.forEach(ku => {
                select.innerHTML += `<option value="${ku}">${ku}</option>`;
            });

            renderCards();
        }

        function renderCards() {
            const filterValue = document.getElementById('kuFilter').value;
            const container = document.getElementById('card-grid');
            container.innerHTML = '';

            const filtered = filterValue === 'Semua' 
                ? allPlayers 
                : allPlayers.filter(p => p.ku === filterValue);

            filtered.forEach(p => {
                container.innerHTML += `
                    <div class="flex flex-col gap-4">
                        <div class="card-container bg-football text-white">
                            <img src="https://via.placeholder.com/200x200?text=LOGO" class="watermark" alt="Logo">
                            <div class="content text-[10px]">
                                <div class="font-bold border-b border-white/30 pb-1 mb-2 text-center text-xs">SSB PUTRA ASGAR</div>
                                <div class="flex gap-2">
                                    <div class="photo-box rounded">
                                        ${p.foto ? `<img src="${p.foto}" class="w-full h-full object-cover" onerror="this.onerror=null;this.src='https://via.placeholder.com/64x80?text=Foto'">` : '<span class="text-[8px] text-gray-400">FOTO</span>'}
                                    </div>
                                    <div class="space-y-0.5 w-full">
                                        <p><b>Nama:</b> ${p.nama}</p>
                                        <p><b>Posisi:</b> ${p.posisi}</p>
                                        <p><b>KU:</b> ${p.ku}</p>
                                        <p><b>NISN:</b> ${p.nisn}</p>
                                        <p><b>TTL:</b> ${p.ttl}</p>
                                        <p><b>Sekolah:</b> ${p.sekolah}</p>
                                        <p class="leading-tight truncate"><b>Alamat:</b> ${p.alamat}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="card-container back-card">
                            <div class="content text-slate-800">
                                <h3 class="font-bold text-center text-xs border-b border-slate-200 pb-1">Ketentuan Anggota</h3>
                                <ul class="text-[8px] list-disc pl-4 mt-2 space-y-1">
                                    <li>Membawa kartu saat latihan/pertandingan.</li>
                                    <li>Menjaga nama baik SSB Putra Asgar.</li>
                                    <li>Disiplin waktu dan kehadiran.</li>
                                </ul>
                                <div class="mt-auto text-[9px] text-center w-full">
                                    <p>Garut, ${new Date().toLocaleDateString('id-ID')}</p>
                                    <p class="mb-8">Kepala SSB Putra Asgar</p>
                                    <div class="border-t border-slate-800 inline-block w-32 font-bold pt-1">Tedi Rustandi, S.Pd</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
